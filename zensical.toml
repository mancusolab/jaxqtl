[project]
strict = true
site_name = "jaxQTL"
site_description = "Cell-type-specific eQTL mapping from single-cell pseudobulk expression."
site_url = "https://mancusolab.github.io/jaxqtl"

repo_url = "https://github.com/mancusolab/jaxqtl"
repo_name = "mancusolab/jaxqtl"
edit_uri = ""

extra_css = ["_static/custom_css.css"]

extra_javascript = [
    "_static/mathjax.js",
    "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js",
]

nav = [
    "index.md",
    { "User guide" = [
        { "Getting started" = [
            "guide/installation.md",
            "guide/quickstart.md",
            { "Analyze single-cell pseudobulk data" = "guide/single-cell-cis.md" },
        ] },
        { "Data preparation" = [
            "guide/genotypes.md",
            "guide/phenotypes.md",
            "guide/covariates.md",
            "guide/compute-pcs.md",
            "guide/offsets.md",
        ] },
        { "Run and interpret scans" = [
            "guide/cis.md",
            "guide/postprocessing.md",
            "guide/nominal.md",
            "guide/trans.md",
            "guide/hpc.md",
        ] },
        { "Methods and troubleshooting" = [
            "guide/model.md",
            "guide/tests.md",
            "guide/troubleshooting.md",
        ] },
    ] },
    { "Command and output reference" = [
        { "Command-line interface" = [
            { "Overview" = "reference/cli.md" },
            "reference/mapping.md",
            "reference/compute-pcs.md",
        ] },
        "reference/outputs.md",
    ] },
    { "Python API reference" = [
        { "Mapping" = ["api/mapping/cis.md", "api/mapping/trans.md"] },
        { "Hypothesis testing" = ["api/hypothesis/variant.md", "api/hypothesis/gene.md"] },
        { "Models and distributions" = ["api/models/glm.md", "api/models/families.md", "api/models/links.md"] },
        { "Input/output" = ["api/data/geno.md", "api/data/pheno.md", "api/data/other.md"] },
        { "Advanced numerics" = ["api/inference/infer.md", "api/inference/solvers.md", "api/inference/stderr.md"] },
    ] },
    { "Project" = [
        "contributing.md",
        "cite.md",
        "project.md",
        "versions.md",
    ] },
]

[project.theme]
variant = "classic"
features = [
    "navigation.sections",
    "toc.integrate",
    "header.autohide",
]
favicon = "_static/qtl-boxplots.svg"
custom_dir = "docs_theme/overrides"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle = { icon = "material/brightness-7", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle = { icon = "material/brightness-4", name = "Switch to light mode" }

[project.theme.icon]
repo = "fontawesome/brands/github"
logo = "custom/qtl-boxplots"

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.snippets]
base_path = "docs"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.toc]
permalink = "¤"
toc_depth = 4

[project.plugins.search]
separator = '[\\s\\-,:!=\\[\\]()"/]+|(?!\\b)(?=[A-Z][a-z])|\\.(?!\\d)|&[lg]t;'

[project.plugins.autorefs]

[project.plugins.mkdocstrings]
custom_templates = "docs_theme/templates"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
load_external_modules = true

[project.plugins.mkdocstrings.handlers.python.options]
force_inspection = true
show_source = false
heading_level = 4
show_root_heading = true
show_symbol_type_heading = true
show_symbol_type_toc = true
filters = ["!^_", "^__init__$"]
inherited_members = true
members_order = "source"
docstring_style = "google"
show_if_no_docstring = true
line_length = 80
modernize_annotations = false
annotations_path = "brief"
show_overloads = false
show_signature_annotations = true
separate_signature = false
