[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "jaxqtl"
dynamic = ["version"]
description = "JAX-based cell-type-specific eQTL mapping with count models"
readme = "README.md"
requires-python = ">=3.11,<4"
license = "MIT"
keywords = [
    "jax",
    "eqtl",
    "qtl mapping",
    "single-cell",
    "scrna-seq",
    "statistical genetics",
    "statistics",
    "machine-learning",
]
authors = [
    { name = "Eleanor Zhang", email = "zzhang39@usc.edu"},
    { name = "Nicholas Mancuso", email = "nmancuso@usc.edu"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "jax",
    "jaxtyping",
    "equinox",
    "lineax",
    "optimistix",
    "genoio>=0.1.0",
    "polars",
    "qtl",
    "pyarrow",
    "rich-argparse>=1.8.0",
]

[project.scripts]
jaxqtl = "jaxqtl.cli:run_cli"

[project.urls]
Documentation = "https://mancusolab.github.io/jaxqtl"
Issues = "https://github.com/mancusolab/jaxqtl/issues"
Source = "https://github.com/mancusolab/jaxqtl"

[project.optional-dependencies]
dev = [
  "coverage[toml]",
  "pytest",
  "pytest-cov",
  "statsmodels",
  "ruff>=0.0.243",
  "ty>=0.0.44",
]
docs = [
  "mkdocstrings-python>=1.12",
  "mkdocstrings>=0.29",
  "zensical>=0.0.37",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/jaxqtl/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src/"]
exclude = ["docs/"]

[tool.hatch.envs.test]
dependencies = [
    "coverage[toml]",
    "pytest",
    "pytest-cov",
]

[tool.hatch.envs.test.scripts]
run-coverage = "pytest -p no:capture --cov-config=pyproject.toml --cov=jaxqtl --cov=tests"
run = "pytest -p no:capture"

[[tool.hatch.envs.all.matrix]]
python = ["3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.lint]
detached = true
dependencies = [
    "ty>=0.0.44",
    "ruff>=0.0.243",
]

[tool.hatch.envs.lint.scripts]
typecheck = "ty check src tests scripts"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I001", "UP"]
ignore = ["E402", "E721", "E731", "E741", "F722", "TID252"]

[tool.ruff.lint.isort]
known-first-party = ["jaxqtl"]
combine-as-imports = true
lines-after-imports = 2
lines-between-types = 1
known-local-folder = ["src"]
section-order = ["future", "standard-library", "third-party", "jax-ecosystem", "first-party", "local-folder"]
order-by-type = false

[tool.ruff.lint.isort.sections]
jax-ecosystem = ["equinox", "jax", "jaxtyping", "lineax", "optimistix"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["scripts"]

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.coverage.run]
source_pkgs = ["jaxqtl", "tests"]
branch = true
parallel = true
omit = [
    "src/jaxqtl/__about__.py",
]

[tool.coverage.paths]
jaxqtl = ["src/jaxqtl", "*/jaxqtl/src/jaxqtl"]
tests = ["tests", "*/jaxqtl/tests"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if TYPE_CHECKING:",
    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",
    # Have to re-enable the standard pragma
    "pragma: no cover",
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self.debug",
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
]
