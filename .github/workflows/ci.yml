name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (uv, Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install test/build environment
        run: |
          uv venv
          uv sync --frozen --extra dev

      - name: Run tests
        run: |
          uv run pytest -p no:capture

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  lint:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install lint environment
        run: |
          uv venv
          uv sync --frozen --extra dev

      - name: Python lint
        run: uv run ruff check src tests scripts

      - name: Python format
        run: uv run ruff format --check src tests scripts

      - name: Type check (advisory)
        run: uv run ty check --exit-zero src tests scripts

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install docs environment
        run: |
          uv venv
          uv sync --frozen --extra docs

      - name: Build docs
        run: |
          uv run zensical build --strict --clean
          rm -rf site

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci
